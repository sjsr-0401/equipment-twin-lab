name: CI

on:
  push:
    branches:
      - main
      - "goal/**"
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore EquipmentTwinLab.sln --ignore-failed-sources

      - name: Build
        run: dotnet build EquipmentTwinLab.sln --no-restore --configuration Release

      - name: Run console tests
        run: dotnet run --project tests/EquipmentTwin.Core.Tests/EquipmentTwin.Core.Tests.csproj --no-restore --configuration Release

      - name: Run normal scenario through CLI
        run: dotnet run --project src/EquipmentTwin.Cli/EquipmentTwin.Cli.csproj --no-restore --configuration Release -- scenarios/normal-cycle.json

      - name: Run timeout scenario through CLI
        run: dotnet run --project src/EquipmentTwin.Cli/EquipmentTwin.Cli.csproj --no-restore --configuration Release -- scenarios/loading-timeout.json --default-timeouts

      - name: Run scenario batch through CLI
        run: dotnet run --project src/EquipmentTwin.Cli/EquipmentTwin.Cli.csproj --no-restore --configuration Release -- batch scenarios --default-timeouts --report artifacts/scenario-report.md

      - name: Run template default panel through CLI
        run: dotnet run --project src/EquipmentTwin.Cli/EquipmentTwin.Cli.csproj --no-restore --configuration Release -- template run templates/vision-inspection-cell.json default-panel --report artifacts/template-run-report.md

      - name: Run template tall part through CLI
        run: dotnet run --project src/EquipmentTwin.Cli/EquipmentTwin.Cli.csproj --no-restore --configuration Release -- template run templates/vision-inspection-cell.json tall-part

      - name: Run template selected inspection through CLI
        run: dotnet run --project src/EquipmentTwin.Cli/EquipmentTwin.Cli.csproj --no-restore --configuration Release -- template run templates/vision-inspection-cell.json default-panel --inspection scratch-detected --report artifacts/template-inspection-scenario-report.md

      - name: Run template expected fault through CLI
        run: dotnet run --project src/EquipmentTwin.Cli/EquipmentTwin.Cli.csproj --no-restore --configuration Release -- template run templates/vision-inspection-cell.json default-panel --fault x-axis-move-timeout --expect-execution-failure --report artifacts/template-fault-expected-failure-report.md

      - name: Run template batch report through CLI
        run: dotnet run --project src/EquipmentTwin.Cli/EquipmentTwin.Cli.csproj --no-restore --configuration Release -- template batch templates/vision-inspection-cell.json --report artifacts/template-batch-report.md

      - name: Run public moly ALD process through CLI
        run: dotnet run --project src/EquipmentTwin.Cli/EquipmentTwin.Cli.csproj --no-restore --configuration Release -- process run processes/public-moly-ald-metallization.json --report artifacts/moly-ald-process-report.md --timeline artifacts/moly-ald-timeline.json

      - name: Run public moly ALD fault matrix through CLI
        run: dotnet run --project src/EquipmentTwin.Cli/EquipmentTwin.Cli.csproj --no-restore --configuration Release -- process batch processes/public-moly-ald-metallization.json --report artifacts/moly-ald-fault-matrix-report.md

      - name: Verify Unity process player, primitive visual, and smoke-test files
        run: |
          test -f unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldTimelineData.cs
          test -f unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldTimelineLoader.cs
          test -f unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldProcessPlayer.cs
          test -f unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldProcessHud.cs
          test -f unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldOperatorCanvas.cs
          test -f unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldPrimitiveVisualizer.cs
          test -f unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldVisualState.cs
          test -f unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldVisualStateMapper.cs
          test -f unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldImportedModelVisualBinding.cs
          test -f unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldDemoBootstrap.cs
          test -f unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Editor/MolyAldEditorSmokeTest.cs
          test -f scripts/Invoke-UnitySmokeTest.ps1
          test -f scripts/Invoke-PortfolioDemoRehearsal.ps1
          test -f scripts/New-PortfolioDemoCueCards.ps1
          test -f docs/unity-smoke-test.md
          test -f docs/unity-demo-screenshot.md
          test -f docs/portfolio-demo-package.md
          test -f docs/unity-demo-recording-checklist.md
          test -f docs/demo-rehearsal-runner.md
          test -f docs/portfolio-demo-narration.md
          test -f docs/unity-model-swap-boundary.md
          test -f docs/design/uiux-agent-brief.md
          test -f docs/design/uiux-review-template.md
          test -f docs/design/uiux-review-log.md
          test -f docs/design/operator-console-design-system.md
          test -f docs/design/public-ald-schematic-reference.md
          test -f docs/demo/moly-ald-demo.png
          test -f goals/031-portfolio-demo-package.md
          test -f goals/032-unity-screenshot-readme-image.md
          test -f goals/033-unity-demo-polish-recording-checklist.md
          test -f goals/034-unity-visual-adapter-boundary.md
          test -f goals/035-demo-rehearsal-runner.md
          test -f goals/036-demo-narration-cue-cards.md
          test -f goals/037-explanatory-unity-demo-screenshot.md
          test -f goals/038-ald-fault-matrix-report.md
          test -f goals/039-unity-operator-console-layout.md
          test -f goals/040-uiux-agent-review-system.md
          test -f goals/041-canvas-operator-panel.md
          test -f goals/042-hmi-typography-instrument-panel.md
          test -f goals/043-process-schematic-main-view.md
          test -f goals/044-gas-flow-animation-fault-highlight.md
          grep -q "RunBatchScreenshotCapture" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Editor/MolyAldEditorSmokeTest.cs
          grep -q "CreateProcessLine" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldPrimitiveVisualizer.cs
          grep -q "Recipe And Step Card" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldPrimitiveVisualizer.cs
          grep -q "Telemetry Card" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldPrimitiveVisualizer.cs
          grep -q "Canvas Process Timeline" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldOperatorCanvas.cs
          grep -q "Timeline Progress Fill" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldOperatorCanvas.cs
          grep -q "Timeline Progress Track" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldPrimitiveVisualizer.cs
          grep -q "Operator Interface" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldPrimitiveVisualizer.cs
          grep -q "Synthetic Moly ALD Module" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldPrimitiveVisualizer.cs
          grep -q "Gas / valve panel" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldPrimitiveVisualizer.cs
          grep -q "MolyAldOperatorCanvas" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldOperatorCanvas.cs
          grep -q "ScreenSpaceCamera" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldOperatorCanvas.cs
          grep -q "MOLY ALD HMI" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldOperatorCanvas.cs
          grep -q "Process Schematic Main View" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldOperatorCanvas.cs
          grep -q "Synthetic Moly ALD — Process Schematic" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldOperatorCanvas.cs
          grep -q "VACUUM CHAMBER" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldOperatorCanvas.cs
          grep -q "Susceptor Heater" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldOperatorCanvas.cs
          grep -q "UpdateProcessSchematic" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldOperatorCanvas.cs
          grep -q "Animated Gas Flow Pulse" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldOperatorCanvas.cs
          grep -q "Animated Exhaust Flow Pulse" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldOperatorCanvas.cs
          grep -q "UpdateGasFlowPulses" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldOperatorCanvas.cs
          grep -q "UpdateExhaustFlowPulses" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldOperatorCanvas.cs
          grep -q "FLOW: Reactant pulse -> chamber" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldOperatorCanvas.cs
          grep -q "PROCESS INSTRUMENTS" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldOperatorCanvas.cs
          grep -q "InstrumentView" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldOperatorCanvas.cs
          grep -q "Normal Range Band" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldOperatorCanvas.cs
          grep -q "ALARM PRIORITY" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldOperatorCanvas.cs
          grep -q "com.unity.ugui" unity/EquipmentTwin.Unity/Packages/manifest.json
          grep -q "MolyAldVisualStateMapper.FromTimeline" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldPrimitiveVisualizer.cs
          grep -q "MolyAldImportedModelVisualBinding" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldImportedModelVisualBinding.cs
          grep -q "ValidateVisualStateMapper" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Editor/MolyAldEditorSmokeTest.cs
          grep -q "fieldOfView = 46f" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldDemoBootstrap.cs
          grep -q "orthographicSize = 2.55f" unity/EquipmentTwin.Unity/Assets/EquipmentTwin/Runtime/MolyAldDemoBootstrap.cs
          grep -q "CaptureScreenshot" scripts/Invoke-UnitySmokeTest.ps1
          grep -q "pumpdown-timeout" scripts/Invoke-PortfolioDemoRehearsal.ps1
          grep -q "AllowedExitCodes @(1)" scripts/Invoke-PortfolioDemoRehearsal.ps1
          grep -q "New-PortfolioDemoCueCards.ps1" scripts/Invoke-PortfolioDemoRehearsal.ps1
          grep -q "recording-cue-cards.md" scripts/New-PortfolioDemoCueCards.ps1
          grep -q "Lam/ALTUS/Halo/Halo HX" docs/portfolio-demo-narration.md
          grep -q "Canvas Operator Panel" docs/design/operator-console-design-system.md
          grep -q "UI/UX Review" docs/design/uiux-review-template.md
          grep -q 'LASTEXITCODE' scripts/Invoke-UnitySmokeTest.ps1
          grep -q "nographics" scripts/Invoke-UnitySmokeTest.ps1
          test -f unity/EquipmentTwin.Unity/Assets/StreamingAssets/moly-ald-timeline.sample.json
